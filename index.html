<script>

/************************************************************
 * BACKEND URL
 ************************************************************/

const API_URL =
'https://script.google.com/macros/s/AKfycbxBiH-oHLXiT9GVHa4WRPHKbObbYT3A2NpUNcqFwh7eNYyNPvP_BCZTFqKOZ3iFIPQ5/exec';


/************************************************************
 * SETTINGS
 ************************************************************/

const SCAN_INTERVAL =
2500;

const CONFIRM_REQUIRED =
2;

const COOLDOWN =
10000;

const GATE_OPEN_TIME =
3500;


let stream =
null;

let running =
false;

let scanning =
false;

let timer =
null;


let previousPlate =
'';

let confirmationCount =
0;


let cooldown =
{};


let adminPIN =
'';


let vehicles =
[];


/************************************************************
 * NAVIGATION
 ************************************************************/

document
.querySelectorAll(
  'nav button'
)
.forEach(
  button => {

    button
    .addEventListener(
      'click',
      () => {

        document
        .querySelectorAll(
          'nav button'
        )
        .forEach(
          x =>
          x.classList.remove(
            'active'
          )
        );


        document
        .querySelectorAll(
          '.page'
        )
        .forEach(
          x =>
          x.classList.remove(
            'active'
          )
        );


        button
        .classList
        .add(
          'active'
        );


        document
        .getElementById(
          button.dataset.page
        )
        .classList
        .add(
          'active'
        );

      }
    );

  }
);


/************************************************************
 * STARTUP
 ************************************************************/

window
.addEventListener(
  'load',
  async () => {

    try {

      const data =
        await api(
          'bootstrap'
        );


      document
      .getElementById(
        'gateName'
      )
      .textContent =
        data.gate ||
        '-';


    } catch (error) {

      toast(
        'เชื่อม Backend ไม่สำเร็จ: ' +
        error.message
      );

    }

  }
);


/************************************************************
 * JSONP
 ************************************************************/

function api(
  action,
  params = {}
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const callback =
        '__wu_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() *
          100000
        );


      const script =
        document
        .createElement(
          'script'
        );


      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                'API TIMEOUT'
              )
            );

          },
          20000
        );


      window[
        callback
      ] =
        data => {

          cleanup();


          if (
            data &&
            data.ok ===
            false
          ) {

            reject(
              new Error(
                data.error ||
                'API ERROR'
              )
            );

            return;

          }


          resolve(
            data
          );

        };


      function cleanup(){

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callback
          ];

        } catch(e) {}


        try {

          script.remove();

        } catch(e) {}

      }


      const query =
        new URLSearchParams({
          action:
            action,

          callback:
            callback,

          ...params
        });


      script.src =
        API_URL +
        '?' +
        query.toString();


      script.onerror =
        () => {

          cleanup();

          reject(
            new Error(
              'เรียก API ไม่สำเร็จ'
            )
          );

        };


      document
      .body
      .appendChild(
        script
      );

    }
  );

}


/************************************************************
 * START AUTO GATE
 ************************************************************/

async function startGate(){

  if (running) {
    return;
  }


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode:
            'environment',

            width: {
              ideal:
              1920
            },

            height: {
              ideal:
              1080
            }

          },

          audio:
          false

        });


    document
    .getElementById(
      'video'
    )
    .srcObject =
      stream;


    running =
      true;


    setScanning(
      true
    );


    document
    .getElementById(
      'ocrStatus'
    )
    .textContent =
      'ระบบทำงานอัตโนมัติแล้ว';


    scheduleScan(
      1000
    );


  } catch (error) {

    toast(
      'เปิดกล้องไม่ได้: ' +
      error.message
    );

  }

}


/************************************************************
 * STOP
 ************************************************************/

function stopGate(){

  running =
    false;


  if (timer) {

    clearTimeout(
      timer
    );

    timer =
      null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(
        track =>
        track.stop()
      );

    stream =
      null;

  }


  previousPlate =
    '';


  confirmationCount =
    0;


  setScanning(
    false
  );


  document
  .getElementById(
    'confirmation'
  )
  .textContent =
    '0/2';


  document
  .getElementById(
    'ocrStatus'
  )
  .textContent =
    'ระบบหยุดทำงาน';

}


/************************************************************
 * SCHEDULER
 ************************************************************/

function scheduleScan(
  delay =
  SCAN_INTERVAL
){

  if (!running) {
    return;
  }


  timer =
    setTimeout(
      autoScan,
      delay
    );

}


/************************************************************
 * AUTO SCAN
 ************************************************************/

async function autoScan(){

  if (
    !running ||
    scanning
  ) {

    scheduleScan(
      500
    );

    return;

  }


  scanning =
    true;


  try {

    const data =
      await readPlate();


    if (!data.plate) {

      previousPlate =
        '';

      confirmationCount =
        0;


      document
      .getElementById(
        'confirmation'
      )
      .textContent =
        '0/' +
        CONFIRM_REQUIRED;


      document
      .getElementById(
        'ocrStatus'
      )
      .textContent =
        'กำลังค้นหาทะเบียน...';


      return;

    }


    document
    .getElementById(
      'confidence'
    )
    .textContent =
      data.confidence +
      '%';


    if (
      data.plate ===
      previousPlate
    ) {

      confirmationCount++;

    } else {

      previousPlate =
        data.plate;

      confirmationCount =
        1;

    }


    document
    .getElementById(
      'confirmation'
    )
    .textContent =
      confirmationCount +
      '/' +
      CONFIRM_REQUIRED;


    document
    .getElementById(
      'ocrStatus'
    )
    .textContent =
      'อ่านได้: ' +
      data.plate +
      ' (' +
      data.confidence +
      '%)';


    if (
      confirmationCount >=
      CONFIRM_REQUIRED
    ) {

      const last =
        cooldown[
          data.plate
        ] ||
        0;


      if (
        Date.now() -
        last >=
        COOLDOWN
      ) {

        cooldown[
          data.plate
        ] =
          Date.now();


        previousPlate =
          '';

        confirmationCount =
          0;


        document
        .getElementById(
          'confirmation'
        )
        .textContent =
          '0/' +
          CONFIRM_REQUIRED;


        await checkPlate(
          data
        );

      }

    }


  } catch (error) {

    document
    .getElementById(
      'ocrStatus'
    )
    .textContent =
      'OCR Error: ' +
      error.message;


  } finally {

    scanning =
      false;


    scheduleScan();

  }

}


/************************************************************
 * OCR
 ************************************************************/

async function readPlate(){

  const video =
    document
    .getElementById(
      'video'
    );


  const canvas =
    document
    .getElementById(
      'canvas'
    );


  const ctx =
    canvas
    .getContext(
      '2d'
    );


  const width =
    video.videoWidth;


  const height =
    video.videoHeight;


  if (
    !width ||
    !height
  ) {

    return {
      plate:'',
      confidence:0,
      raw:''
    };

  }


  const sx =
    Math.floor(
      width *
      .18
    );


  const sy =
    Math.floor(
      height *
      .57
    );


  const sw =
    Math.floor(
      width *
      .64
    );


  const sh =
    Math.floor(
      height *
      .24
    );


  canvas.width =
    sw *
    2;


  canvas.height =
    sh *
    2;


  ctx.drawImage(
    video,

    sx,
    sy,
    sw,
    sh,

    0,
    0,
    canvas.width,
    canvas.height
  );


  preprocess(
    canvas,
    ctx
  );


  const result =
    await Tesseract
      .recognize(

        canvas,

        'tha+eng',

        {

          logger:
          info => {

            if (
              info.status ===
              'recognizing text'
            ) {

              document
              .getElementById(
                'ocrStatus'
              )
              .textContent =
                'กำลังอ่านทะเบียน ' +
                Math.round(
                  (
                    info.progress ||
                    0
                  ) *
                  100
                ) +
                '%';

            }

          }

        }

      );


  const raw =
    String(
      result.data.text ||
      ''
    ).trim();


  const confidence =
    Math.round(
      result.data.confidence ||
      0
    );


  return {

    plate:
      extractPlate(
        raw
      ),

    confidence:
      confidence,

    raw:
      raw

  };

}


/************************************************************
 * IMAGE PREPROCESS
 ************************************************************/

function preprocess(
  canvas,
  ctx
){

  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  const data =
    image.data;


  for (
    let i = 0;
    i < data.length;
    i += 4
  ) {

    const gray =
      .299 *
      data[i]
      +
      .587 *
      data[i + 1]
      +
      .114 *
      data[i + 2];


    let value =
      (
        gray -
        128
      ) *
      1.7 +
      128;


    value =
      Math.max(
        0,
        Math.min(
          255,
          value
        )
      );


    data[i] =
      value;

    data[i + 1] =
      value;

    data[i + 2] =
      value;

  }


  ctx.putImageData(
    image,
    0,
    0
  );

}


/************************************************************
 * THAI PLATE PARSER
 ************************************************************/

function extractPlate(
  raw
){

  let text =
    String(
      raw ||
      ''
    )
    .toUpperCase();


  text =
    text
    .replace(
      /ประเทศไทย|THAILAND/g,
      ' '
    );


  const lines =
    text
      .split(
        /\n/
      )
      .map(
        value =>
        value.trim()
      )
      .filter(
        Boolean
      );


  const candidates =
    [];


  for (
    const line of lines
  ) {

    const cleaned =
      line
      .replace(
        /[^ก-ฮA-Z0-9]/g,
        ''
      );


    if (
      /[ก-ฮ]/.test(
        cleaned
      )
      &&
      /\d/.test(
        cleaned
      )
    ) {

      candidates.push(
        cleaned
      );

    }

  }


  if (
    candidates.length
  ) {

    return candidates
      .sort(
        (
          a,
          b
        ) =>
        b.length -
        a.length
      )[0]
      .slice(
        0,
        9
      );

  }


  const all =
    text
      .replace(
        /[^ก-ฮA-Z0-9]/g,
        ''
      );


  const match =
    all.match(
      /[ก-ฮ]{1,3}\d{1,4}/
    );


  if (match) {

    return match[0];

  }


  return '';

}

 ************************************************************/

async function checkPlate(
  data
){

  const box =
    document
    .getElementById(
      'resultBox'
    );


  box.className =
    'result waiting';


  box.innerHTML =
    `
    <span class="badge orange">
    กำลังตรวจสอบ
    </span>

    <div class="plate">
    ${escapeHtml(data.plate)}
    </div>

    <div>
    กำลังตรวจสอบฐานข้อมูล
    </div>
    `;


  try {

    const result =
      await api(
        'checkAccess',
        {

          plate_no:
            data.plate,

          confidence:
            data.confidence,

          ocr_raw:
            data.raw,

          direction:
            document
            .getElementById(
              'direction'
            )
            .value

        }
      );


    displayResult(
      result
    );


  } catch (error) {

    box.className =
      'result denied';


    box.innerHTML =
      `
      <span class="badge red">
      ERROR
      </span>

      <div class="plate">
      ${escapeHtml(data.plate)}
      </div>

      <div>
      ${escapeHtml(error.message)}
      </div>
      `;

  }

}


/************************************************************
 * RESULT
 ************************************************************/

function displayResult(
  result
){

  const granted =
    result.result ===
    'GRANTED';


  const box =
    document
    .getElementById(
      'resultBox'
    );


  box.className =
    'result ' +
    (
      granted
        ?
        'granted'
        :
        'denied'
    );


  box.innerHTML =
    `

    <span
    class="badge ${
      granted
        ?
        'green'
        :
        'red'
    }"
    >

    ${
      granted
        ?
        'อนุญาต'
        :
        'ปฏิเสธ'
    }

    </span>


    <div class="plate">

    ${
      escapeHtml(
        result.plate_no ||
        '—'
      )
    }

    </div>


    <div>

    ${
      escapeHtml(
        result.reason ||
        ''
      )
    }

    </div>

    `;


  const gate =
    document
    .getElementById(
      'gate'
    );


  if (granted) {

    gate.className =
      'gate open';


    gate.textContent =
      'เปิด';


    setTimeout(
      () => {

        gate.className =
          'gate';


        gate.textContent =
          'ปิด';

      },
      GATE_OPEN_TIME
    );


  } else {

    gate.className =
      'gate';


    gate.textContent =
      'ปิด';

  }


  const vehicle =
    result.vehicle;


  document
  .getElementById(
    'vehicleInfo'
  )
  .innerHTML =
    vehicle

      ?

      `

      <b>
      ${escapeHtml(
        vehicle.owner_name ||
        ''
      )}
      </b>

      <br>

      ประเภท:
      ${escapeHtml(
        vehicle.owner_type ||
        ''
      )}

      <br>

      ทะเบียน:
      ${escapeHtml(
        vehicle.plate_no ||
        ''
      )}

      <br>

      จังหวัด:
      ${escapeHtml(
        vehicle.province ||
        ''
      )}

      <br>

      รถ:
      ${escapeHtml(
        [
          vehicle.brand,
          vehicle.model,
          vehicle.color
        ]
        .filter(Boolean)
        .join(' ')
      )}

      `

      :

      'ไม่พบทะเบียนในระบบ';

}

/************************************************************

 ************************************************************/

function setScanning(
  active
){

  document
  .getElementById(
    'scanDot'
  )
  .className =
    'dot ' +
    (
      active
        ?
        'active'
        :
        ''
    );


  document
  .getElementById(
    'scanText'
  )
  .textContent =
    active
      ?
      'กำลังสแกน'
      :
      'หยุด';

}


/************************************************************
 * ESCAPE
 ************************************************************/

function escapeHtml(
  value
){

  return String(
    value ??
    ''
  )
  .replace(
    /[&<>"']/g,
    char => ({
      '&':
      '&amp;',

      '<':
      '&lt;',

      '>':
      '&gt;',

      '"':
      '&quot;',

      "'":
      '&#039;'

    })[
      char
    ]
  );

}


function escapeJs(
  value
){

  return String(
    value ??
    ''
  )
  .replace(
    /\\/g,
    '\\\\'
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/************************************************************
 * TOAST
 ************************************************************/

function toast(
  message
){

  const toast =
    document
    .getElementById(
      'toast'
    );


  toast.textContent =
    message;


  toast.style.display =
    'block';


  setTimeout(
    () => {

      toast.style.display =
        'none';

    },
    3200
  );

}
